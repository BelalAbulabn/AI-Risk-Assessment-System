<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/styles_risk.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@10"></script>
    <script src="/static/scripts_risk.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk Management Process</title>
</head>
<body>
    <div class="container">
        <!-- File Selection Section -->
        <div id="file-selection" class="mt-4">
            <h3 class="title">Select a File</h3>
            <div class="form-group">
                <label for="file-select">Available Files:</label>
                <select id="file-select" class="form-control select">
                    <!-- Options will be populated by JavaScript -->
                </select>
            </div>
            <button id="loadFileBtn" class="btn btn-info btn-block">Load File</button>
            <div id="file-content" class="mt-3">
                <!-- File content will be displayed here -->
            </div>
            <h2 class="text-center mb-4 title">Risk Management</h2>
            <button id="generateRiskAnalysisBtn" class="btn btn-info btn-block">Generate Risk Analysis</button>
            <button id="texteditFileContent" class="btn btn-secondary mt-3">Text Edit</button>
        </div>

        <!-- Risk Analysis Section -->
        <section class="risk-analysis mt-5">
            <h2 class="text-center mb-4 title">Risk Analysis</h2>
            <ul id="failure-mode-select" class="list-group mb-3"></ul>
            <div id="loading-message" class="text-center" style="display: none;">Generating...</div>
            <div class="button-container text-center">
                <button id="texteditRiskAnalysis" class="btn btn-warning text-edit">Text Edit</button>
                <button id="generateRiskEvaluationBtn" class="btn btn-primary">Generate Risk Evaluation</button>
            </div>
        </section>
        
        <div class="arrow-container text-center">
            <div class="stick"></div>
            <div class="arrow"></div>
        </div>
        
        <!-- Risk Evaluation Section -->
        <section class="risk-evaluation mt-5">
            <h2 class="text-center mb-4 title">Risk Evaluation</h2>
            <ul id="Evaluations" class="list-group mb-3"></ul>
            <div id="loading-message-evaluation" class="text-center" style="display: none;">Generating...</div>
            <div class="button-container text-center">
                <button id="texteditRiskEvaluation" class="btn btn-warning text-edit">Text Edit</button>
                <button id="generateRiskControlBtn" class="btn btn-primary">Generate Risk Control</button>
            </div>
        </section>
        
        <div class="arrow-container text-center">
            <div class="stick"></div>
            <div class="arrow"></div>
        </div>
        
        <!-- Risk Control Section -->
        <section class="risk-control mt-5">
            <h2 class="text-center mb-4 title">Risk Control</h2>
            <ul id="risk-control-list" class="list-group mb-3"></ul>
            <div id="loading-message-control" class="text-center" style="display: none;">Generating...</div>
            <div class="button-container text-center">
                <button id="texteditRiskControl" class="btn btn-warning text-edit">Text Edit</button>
                <button id="generateResidualRiskBtn" class="btn btn-primary">Generate Residual Risk</button>
            </div>
        </section>
        
        <div class="arrow-container text-center">
            <div class="stick"></div>
            <div class="arrow"></div>
        </div>
        
        <!-- Residual Risk Section -->
        <section class="residual-risk mt-5">
            <h2 class="text-center mb-4 title">Evaluation of Overall Residual Risk</h2>
            <div id="results" class="mb-3"></div>
            <div id="loading-message-residual" class="text-center" style="display: none;">Generating...</div>
            <div class="button-container text-center">
                <button id="texteditResidualRisk" class="btn btn-warning text-edit">Text Edit</button>
                <button id="generateResidualRiskBtn" class="btn btn-primary">Generate Residual Risk</button>
            </div>
        </section>
        
        <div class="arrow-container text-center">
            <div class="stick"></div>
            <div class="arrow"></div>
        </div>
        
        <!-- Risk Management Review Section -->
        <section class="management-review mt-5">
            <h2 class="text-center mb-4 title">Risk Management Review</h2>
            <div class="button-container text-center">
                <button id="downloadReport" class="btn btn-secondary">Download</button>
                <button id="generateFinalReportBtn" class="btn btn-primary">Generate the Final Report</button>
            </div>
        </section>
    </div>
</body>
</html>
